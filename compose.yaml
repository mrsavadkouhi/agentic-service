name: agentic-service-local

x-app: &app
  image: agentic-service-local:0.1.0
  build: .
  init: true
  mem_limit: 192m
  cpus: 0.25
  pids_limit: 128
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &app-env
    AGENTIC_DATABASE_URL: ${AGENTIC_DATABASE_URL:?Run scripts/init_local_env.py first}
    AGENTIC_TEMPORAL_ADDRESS: temporal:7233
    AGENTIC_TEMPORAL_NAMESPACE: agentic
    AGENTIC_DISPATCH_MODE: ${AGENTIC_DISPATCH_MODE:-observe}
    AGENTIC_MIRZA_MODE: ${AGENTIC_MIRZA_MODE:-observe}
    AGENTIC_DISPATCH_PAUSED: ${AGENTIC_DISPATCH_PAUSED:-false}
    AGENTIC_MIRZA_PAUSED: ${AGENTIC_MIRZA_PAUSED:-false}
    AGENTIC_DISPATCH_TASK_QUEUE: ${AGENTIC_DISPATCH_TASK_QUEUE:-agentic-dispatch}
    AGENTIC_MIRZA_TASK_QUEUE: ${AGENTIC_MIRZA_TASK_QUEUE:-agentic-mirza}
    AGENTIC_LOG_LEVEL: ${AGENTIC_LOG_LEVEL:-INFO}
  depends_on:
    migrate:
      condition: service_completed_successfully
    temporal:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local_env.py first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/init_local_env.py first}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Run scripts/init_local_env.py first}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=60", "-c", "work_mem=2MB", "-c", "max_wal_size=256MB"]
    ports:
      - "127.0.0.1:${AGENTIC_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-agentic.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Run scripts/init_local_env.py first}
      POSTGRES_SEEDS: postgres
      SKIP_DB_CREATE: "true"
      DEFAULT_NAMESPACE: agentic
      DEFAULT_NAMESPACE_RETENTION: 3d
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      GOMEMLIMIT: 350MiB
      GOMAXPROCS: "2"
    ports:
      - "127.0.0.1:${AGENTIC_TEMPORAL_PORT:-17233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${AGENTIC_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=12)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s

  dispatch-worker:
    <<: *app
    command: ["python", "-m", "app.worker", "--role", "dispatch"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health", "--role", "dispatch"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  mirza-worker:
    <<: *app
    command: ["python", "-m", "app.worker", "--role", "mirza"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health", "--role", "mirza"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
